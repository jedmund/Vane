use_default_settings: true

general:
  instance_name: 'searxng'

search:
  autocomplete: 'google'
  formats:
    - html
    - json

server:
  # Placeholder substituted at container start by entrypoint.sh. The real
  # secret comes from $SEARXNG_SECRET, or a persisted file under the data
  # volume if the env var is unset. See entrypoint.sh for details.
  secret_key: '__SEARXNG_SECRET__'

engines:
  - name: wolframalpha
    disabled: false
